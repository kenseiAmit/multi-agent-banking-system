sources:
  deposit:
    kind: mysql
    host: ${MYSQL_HOST}
    port: ${MYSQL_PORT}
    database: bank
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  loan:
    kind: mysql
    host: ${MYSQL_HOST}
    port: ${MYSQL_PORT}
    database: bank
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

tools:
  # Deposit Tools
  list-accounts:
    kind: mysql-sql
    source: deposit
    description: List all deposit accounts for the customer.
    statement: SELECT account_type FROM accounts WHERE customer_id = 1;

  get-balance:
    kind: mysql-sql
    source: deposit
    description: Get the current balance for a specifically named deposit account (e.g., 'vacation' or 'primary').
    parameters:
      - name: account_type
        type: string
        description: The name or type of the deposit account (e.g. vacation or primary).
    statement: SELECT CAST(balance AS DOUBLE) AS balance FROM accounts WHERE LOWER(account_type) = LOWER(?) AND customer_id = 1;

  get-transactions:
    kind: mysql-sql
    source: deposit
    description: Get recent transactions for a specifically named deposit account.
    parameters:
      - name: account_type
        type: string
        description: The name or type of the deposit account (e.g. vacation or primary).
    statement: SELECT t.transaction_date, CAST(t.amount AS DOUBLE) AS amount, t.description FROM transactions t JOIN accounts a ON t.account_id = a.id WHERE LOWER(a.account_type) = LOWER(?) AND a.customer_id = 1 ORDER BY t.transaction_date DESC LIMIT 5;

  check-minimum-balance:
    kind: mysql-sql
    source: deposit
    description: Check if the sum of all deposit account balances is greater than a specified minimum amount. Returns true or false.
    parameters:
      - name: minimum_balance
        type: float
        description: The minimum balance threshold to compare total deposits against.
    statement: SELECT IF(COALESCE(SUM(balance), 0) > ?, true, false) AS meets_minimum FROM accounts WHERE customer_id = 1;

  # Loan Tools
  get-outstanding-balance:
    kind: mysql-sql
    source: loan
    description: Get the outstanding balance for a specifically named loan (e.g. 'auto' or 'personal').
    parameters:
      - name: loan_type
        type: string
        description: The type or name of the loan (e.g. auto, personal).
    statement: SELECT loan_type, CAST(outstanding_balance AS DOUBLE) AS outstanding_balance FROM loans WHERE LOWER(loan_type) = LOWER(?) AND customer_id = 1;

  get-loan-details:
    kind: mysql-sql
    source: loan
    description: Get loan terms and details including origination date, amount, outstanding balance, terms, monthly payment, and next payment date.
    parameters:
      - name: loan_type
        type: string
        description: The type of loan (e.g. auto, personal).
    statement: SELECT loan_type, origination_date, CAST(amount AS DOUBLE) AS amount, CAST(outstanding_balance AS DOUBLE) AS outstanding_balance, terms, CAST(monthly_payment AS DOUBLE) AS monthly_payment, next_payment_date FROM loans WHERE LOWER(loan_type) = LOWER(?) AND customer_id = 1;

  get-next-payment-date:
    kind: mysql-sql
    source: loan
    description: Get the next loan payment date and monthly payment amount for a loan.
    parameters:
      - name: loan_type
        type: string
        description: The type of loan (e.g. auto, personal).
    statement: SELECT loan_type, CAST(monthly_payment AS DOUBLE) AS monthly_payment, next_payment_date FROM loans WHERE LOWER(loan_type) = LOWER(?) AND customer_id = 1;

  get-all-loans:
    kind: mysql-sql
    source: loan
    description: List all existing loans, balances, terms, and payment dates for the customer.
    statement: SELECT loan_type, CAST(amount AS DOUBLE) AS amount, CAST(outstanding_balance AS DOUBLE) AS outstanding_balance, terms, CAST(monthly_payment AS DOUBLE) AS monthly_payment, next_payment_date FROM loans WHERE customer_id = 1;

  get-total-outstanding-balance:
    kind: mysql-sql
    source: loan
    description: Get the total sum of all outstanding balances across all loans for the customer.
    statement: SELECT CAST(COALESCE(SUM(outstanding_balance), 0) AS DOUBLE) AS total_outstanding_balance FROM loans WHERE customer_id = 1;
