<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 304" width="100%" role="img" aria-label="Multi-Agent Banking System">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="304" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="304" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="304" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="304" rx="18" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="302" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="56" y="0" width="220" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Eyebrow Badge -->
  <g transform="translate(56, 38)">
    <rect width="232" height="28" rx="14" fill="#1D4ED8" fill-opacity="0.28" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18.5" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.1">MULTI-AGENT ARCHITECTURE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="56" y="118" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">Multi-Agent Banking System</text>
  <text x="56" y="156" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">Decoupled Google ADK Microservices over A2A JSON-RPC · MCP SQL Toolbox · LangGraph Router</text>
  <line x1="56" y1="192" x2="790" y2="192" stroke="#1E293B" stroke-width="1.2"/>

  <!-- KPI Stat Pills -->
  
    <g transform="translate(56, 224)">
      <rect width="210" height="44" rx="10" fill="#111827" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="18" cy="22" r="4.5" fill="#3B82F6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="18" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">A2A SUITE</text>
      <text x="31" y="34" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">18/18 Passed</text>
    </g>
    <g transform="translate(280, 224)">
      <rect width="194" height="44" rx="10" fill="#111827" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="18" cy="22" r="4.5" fill="#3B82F6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="18" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">WORKFLOWS</text>
      <text x="31" y="34" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">5/5 Suites</text>
    </g>
    <g transform="translate(488, 224)">
      <rect width="234" height="44" rx="10" fill="#111827" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="18" cy="22" r="4.5" fill="#3B82F6">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="18" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">EQUITY MATH</text>
      <text x="31" y="34" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">Deterministic</text>
    </g>
    <g transform="translate(736, 224)">
      <rect width="202" height="44" rx="10" fill="#111827" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="18" cy="22" r="4.5" fill="#3B82F6">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="18" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">SQL ACCESS</text>
      <text x="31" y="34" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">MCP Scoped</text>
    </g>

  <!-- Right-Side Animated Topology Panel -->
  <rect x="832" y="24" width="330" height="256" rx="14" fill="#090E1A" fill-opacity="0.72" stroke="#1E293B" stroke-width="1.2"/>
  
    <g transform="translate(850, 44)">
      <rect width="294" height="40" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="40" rx="2.5" fill="#3B82F6"/>
      <circle cx="22" cy="20" r="5" fill="#3B82F6">
        <animate attributeName="r" values="4;6;4" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="25" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Manager Gateway (RemoteA2A)</text>
    </g>
    <line x1="997" y1="84" x2="997" y2="104" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <circle cx="997" cy="84" r="3" fill="#06B6D4">
      <animate attributeName="cy" values="84;104" dur="1.4s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(850, 104)">
      <rect width="294" height="40" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="40" rx="2.5" fill="#06B6D4"/>
      <circle cx="22" cy="20" r="5" fill="#06B6D4">
        <animate attributeName="r" values="4;6;4" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="25" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Deposit Service (MCP MySQL)</text>
    </g>
    <line x1="997" y1="144" x2="997" y2="164" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <circle cx="997" cy="144" r="3" fill="#06B6D4">
      <animate attributeName="cy" values="144;164" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(850, 164)">
      <rect width="294" height="40" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="40" rx="2.5" fill="#3B82F6"/>
      <circle cx="22" cy="20" r="5" fill="#3B82F6">
        <animate attributeName="r" values="4;6;4" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="25" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Loan Underwriter (ADK Loop)</text>
    </g>
    <line x1="997" y1="204" x2="997" y2="224" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity="0.7"/>
    <circle cx="997" cy="204" r="3" fill="#06B6D4">
      <animate attributeName="cy" values="204;224" dur="1.4s" begin="0.90s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(850, 224)">
      <rect width="294" height="40" rx="9" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="40" rx="2.5" fill="#06B6D4"/>
      <circle cx="22" cy="20" r="5" fill="#06B6D4">
        <animate attributeName="r" values="4;6;4" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="25" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">TotalValueAgent Python Math</text>
    </g>
</svg>
